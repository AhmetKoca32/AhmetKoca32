<svg xmlns="http://www.w3.org/2000/svg" width="510" height="202" viewBox="0 0 510 202" role="img" aria-label="ZONERUN mission: GPS TERRITORY CHALLENGE">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1929"/><stop offset="1" stop-color="#171c30"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#DBEBFD" stroke-opacity=".04"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.m{font-family:Consolas,'Courier New',monospace}.pulse{animation:pulse 3s ease-in-out infinite}.orbit{transform-origin:433px 79px;animation:orbit 13s linear infinite}.stroke{animation:dash 3s linear infinite}.scan{animation:scan 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-80}}@keyframes scan{0%,100%{opacity:.25}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="508" height="200" rx="17" fill="url(#b)" stroke="#36485e" stroke-width="2"/><rect x="2" y="2" width="506" height="198" rx="16" fill="url(#grid)"/>
<rect x="1" y="1" width="5" height="200" rx="2" fill="#F2D17C"/>
<circle cx="33" cy="30" r="5" fill="#F2D17C" class="pulse"/>
<text x="49" y="35" class="m" font-size="13" fill="#AFC6D9">MISSION 05 <tspan fill="#F2D17C">// GPS TERRITORY CHALLENGE</tspan></text>
<text x="31" y="105" font-size="36" font-weight="800" fill="#F5F9FD" letter-spacing=".5">ZONERUN</text>
<text x="31" y="138" class="m" font-size="15" fill="#F2D17C">FLUTTER / MAPS</text>
<path d="M31 161H480" stroke="#394B5F" stroke-width="1.5"/>
<path d="M31 161H480" stroke="#F2D17C" stroke-width="2.5" stroke-dasharray="4 28" class="stroke"/>
