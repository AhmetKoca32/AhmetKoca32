<path d="M11 40L19 14L37 19L45 40L11 40 M19 14L37 19 M27 34a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" fill="none" stroke="#F2D17C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="scan"/>
</g>
<circle cx="433" cy="82" r="43" stroke="#F2D17C" stroke-width="1.5" stroke-dasharray="7 15" fill="none" stroke-opacity=".45" class="orbit"/>
