<style>text{font-family:Arial,Helvetica,sans-serif}.m{font-family:Consolas,'Courier New',monospace}.flow{animation:flow 4s linear infinite}.flow2{animation:flow 5.5s linear infinite reverse}.glow{animation:glow 2.6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-90}}@keyframes glow{0%,100%{opacity:.3}50%{opacity:.95}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
