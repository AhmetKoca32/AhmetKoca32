<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="130" viewBox="0 0 1100 130" role="img" aria-label="Animated neon arcade announcement: Explore, Create, Deploy, Repeat">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151534"/><stop offset=".5" stop-color="#10213b"/><stop offset="1" stop-color="#251330"/></linearGradient><linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53f2d3"/><stop offset=".2" stop-color="#73baff"/><stop offset=".4" stop-color="#b596ff"/><stop offset=".65" stop-color="#ff7eb6"/><stop offset=".83" stop-color="#ffc36f"/><stop offset="1" stop-color="#53f2d3"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#6ccbf4" opacity=".16"/></pattern></defs>
<style>text{font-family:Consolas,'Courier New',monospace}.lane{animation:lane 8s linear infinite}.blink{animation:blink 2.6s ease-in-out infinite}.blink2{animation:blink 2.6s ease-in-out 1s infinite}.slide{animation:slide 9s linear infinite}@keyframes lane{to{stroke-dashoffset:-150}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="1098" height="128" rx="19" fill="url(#bg)" stroke="#48506e" stroke-width="2"/><rect x="1" y="1" width="1098" height="128" rx="19" fill="url(#dots)"/>
<path d="M0 0H1100" stroke="url(#rainbow)" stroke-width="5" stroke-dasharray="80 30" class="lane"/>
<text x="550" y="51" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="3" fill="#f7f2ff">EXPLORE <tspan fill="#68f3d7">/</tspan> CREATE <tspan fill="#d5a7ff">/</tspan> DEPLOY <tspan fill="#ff93bb">/</tspan> REPEAT</text>
<text x="550" y="86" text-anchor="middle" font-size="15" fill="#b8c9ee">A LITTLE CHAOS. A LOT OF BUILDING.</text>
<text x="68" y="83" font-size="28" fill="#70e9ff" class="blink">✦</text><text x="990" y="83" font-size="27" fill="#ffbc77" class="blink2">✦</text>
<rect x="404" y="102" width="292" height="5" rx="2.5" fill="#2c3957"/><rect x="404" y="102" width="88" height="5" rx="2.5" fill="url(#rainbow)" class="slide"/>
</svg>