<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="t d">
<title id="t">Byte's secret terminal quest</title>
<desc id="d">A colorful animated, fictional arcade terminal. The typed commands are jokes and visual decoration; no commands execute.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F1930"/><stop offset=".54" stop-color="#1C1B3B"/><stop offset="1" stop-color="#311C3E"/></linearGradient>
  <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5EF2DC"/><stop offset=".33" stop-color="#8BB3FF"/><stop offset=".66" stop-color="#E5A6FF"/><stop offset="1" stop-color="#FFB37E"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ACBEFF" opacity=".12"/></pattern>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
.cursor{animation:blink 1.2s steps(1,end) infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}.pulse2{animation:pulse 3.5s ease-in-out 1s infinite}.flow{animation:flow 8s linear infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-180}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1098" height="358" rx="20" fill="url(#bg)" stroke="#6B5C97" stroke-width="2"/>
<rect x="1" y="1" width="1098" height="358" rx="20" fill="url(#dots)"/>
<path d="M3 3H1097" stroke="url(#rgb)" stroke-width="5"/>
<circle cx="30" cy="33" r="6" fill="#FF718A"/><circle cx="53" cy="33" r="6" fill="#FFCE7B"/><circle cx="76" cy="33" r="6" fill="#5CF3C5"/>
<text x="102" y="38" class="mono" font-size="15" letter-spacing="1" fill="#EBE5FF">BYTE://SECRET_LEVEL</text>
<text x="1072" y="37" text-anchor="end" class="mono" font-size="12" fill="#82F3DE">ACHIEVEMENT UNLOCKED</text>
<path d="M0 65H1100" stroke="#5A527F" stroke-width="1.5"/>
<rect x="29" y="85" width="720" height="230" rx="14" fill="#101D32" stroke="#445D79" stroke-width="1.5"/>
<text x="48" y="116" class="mono" font-size="17" fill="#76F0DD">$ sudo hire ahmet</text>
<text x="48" y="147" class="mono" font-size="14" fill="#CFB8FF">[byte]: checking mission compatibility...</text>
<text x="48" y="176" class="mono" font-size="15" fill="#FFE3B7">PASS  // curiosity detected</text>
<text x="48" y="202" class="mono" font-size="15" fill="#9FD6FF">PASS  // real projects found</text>
<text x="48" y="228" class="mono" font-size="15" fill="#A1F6D2">PASS  // ready to collaborate</text>
<text x="48" y="268" class="mono" font-size="15" fill="#D9E5F5">$ echo "Let's build something useful"</text>
<text x="48" y="293" class="mono" font-size="15" fill="#6FEADE">Let's build something useful<tspan class="cursor">_</tspan></text>
<g>
<circle cx="913" cy="183" r="110" fill="#372850" opacity=".56"/>
<circle cx="913" cy="183" r="93" fill="none" stroke="#B5A8FF" stroke-dasharray="12 15" stroke-width="3" class="flow"/>
<circle cx="913" cy="183" r="70" fill="#172C47" stroke="#6FE9E2" stroke-width="3"/>
<path d="M880 169l20 20 49-52" fill="none" stroke="#76F0C3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="913" cy="183" r="112" fill="none" stroke="#FFB6D7" stroke-width="1.5" stroke-opacity=".55" class="pulse"/>
</g>
<text x="914" y="313" text-anchor="middle" class="mono" font-size="14" fill="#EDC9FF">SECRET QUEST COMPLETE</text>
</svg>