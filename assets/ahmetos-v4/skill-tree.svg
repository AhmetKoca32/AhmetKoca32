<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">AhmetOS v4 skill tree</title><desc id="desc">Animated neon skill tree with four explored paths: backend engineering, applied AI, Flutter mobile and software delivery. The tree is illustrative and does not assign artificial proficiency levels.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1629"/><stop offset=".6" stop-color="#151A35"/><stop offset="1" stop-color="#261635"/></linearGradient>
<linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5AEDD5"/><stop offset=".33" stop-color="#76BBFF"/><stop offset=".65" stop-color="#CA9EFF"/><stop offset="1" stop-color="#FFB27D"/></linearGradient>
<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#A0BAE5" stroke-opacity=".055"/></pattern>
<radialGradient id="halo"><stop stop-color="#B2A1FF" stop-opacity=".23"/><stop offset="1" stop-color="#B2A1FF" stop-opacity="0"/></radialGradient>
</defs>
