<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title desc">
<title id="title">AhmetOS animated technology marquee</title>
<desc id="desc">A seamless horizontal strip of seven colorful neon technology cards scrolling across the screen: Python, FastAPI, Flutter, PostgreSQL, Docker, Redis, and RAG / AI.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#0E1930"/><stop offset=".58" stop-color="#151A34"/><stop offset="1" stop-color="#23172E"/></linearGradient>
<linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58DCD8"/><stop offset=".5" stop-color="#9EA4F8"/><stop offset="1" stop-color="#CE91EF"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#B9C9EF" stroke-opacity=".045" fill="none"/></pattern>
<clipPath id="marqueeWindow"><rect x="18" y="80" width="1064" height="73" rx="12"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
.ticker-track{animation:marquee 25s linear infinite}
.led{animation:glimmer 3.2s ease-in-out infinite}
.status{animation:glimmer 2.1s ease-in-out infinite}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-1190px)}}
@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.ticker-track,.led,.status{animation:none!important}}
</style>
