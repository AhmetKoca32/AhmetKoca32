<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="218" viewBox="0 0 1100 218" role="img" aria-labelledby="title desc">
<title id="title">Byte's fictional arcade power-up cards</title><desc id="desc">Three playful fictional power-ups: Debug Vision, Idea Engine, and Ship Mode. They represent themes, not real certificates or measured skills.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111E35"/><stop offset="1" stop-color="#261B3F"/></linearGradient><linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65F0D7"/><stop offset=".5" stop-color="#C5A7FF"/><stop offset="1" stop-color="#FFD09D"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.spark{animation:pulse 3.4s ease-in-out infinite}.flow{animation:flow 7s linear infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="1098" height="216" rx="19" fill="url(#bg)" stroke="#555A81" stroke-width="2"/><path d="M2 3H1097" stroke="url(#light)" stroke-width="4"/>
<text x="26" y="38" class="mono" font-size="15" letter-spacing="1" fill="#D8C9FF">BYTE'S INVENTORY <tspan fill="#84EDD6">// JUST FOR FUN</tspan></text>
<g><rect x="24" y="71" width="334" height="121" rx="16" fill="#1A2841" stroke="#7CEBD8" stroke-width="2"/><rect x="41" y="89" width="63" height="63" rx="13" fill="#112239" stroke="#7CEBD8" stroke-opacity=".8" stroke-width="2"/><text x="72" y="129" text-anchor="middle" font-size="22" font-weight="800" fill="#7CEBD8">&lt; &gt;</text><text x="118" y="115" font-size="18" font-weight="800" fill="#F3F6FF">DEBUG VISION</text><text x="118" y="140" class="mono" font-size="11" fill="#BECBE2">BUGS ARE JUST SIDE QUESTS</text><circle cx="333" cy="91" r="4" fill="#7CEBD8" class="spark"/><path d="M118 168H322" stroke="#7CEBD8" stroke-opacity=".43" stroke-width="2" stroke-dasharray="10 8" class="flow"/></g><g><rect x="384" y="71" width="334" height="121" rx="16" fill="#1A2841" stroke="#CAA7FF" stroke-width="2"/><rect x="401" y="89" width="63" height="63" rx="13" fill="#112239" stroke="#CAA7FF" stroke-opacity=".8" stroke-width="2"/><text x="432" y="129" text-anchor="middle" font-size="22" font-weight="800" fill="#CAA7FF">*</text><text x="478" y="115" font-size="18" font-weight="800" fill="#F3F6FF">IDEA ENGINE</text><text x="478" y="140" class="mono" font-size="11" fill="#BECBE2">THINK, TEST, REBUILD</text><circle cx="693" cy="91" r="4" fill="#CAA7FF" class="spark"/><path d="M478 168H682" stroke="#CAA7FF" stroke-opacity=".43" stroke-width="2" stroke-dasharray="10 8" class="flow"/></g><g><rect x="744" y="71" width="334" height="121" rx="16" fill="#1A2841" stroke="#FFC58C" stroke-width="2"/><rect x="761" y="89" width="63" height="63" rx="13" fill="#112239" stroke="#FFC58C" stroke-opacity=".8" stroke-width="2"/><text x="792" y="129" text-anchor="middle" font-size="22" font-weight="800" fill="#FFC58C">//</text><text x="838" y="115" font-size="18" font-weight="800" fill="#F3F6FF">SHIP MODE</text><text x="838" y="140" class="mono" font-size="11" fill="#BECBE2">MAKE IT WORK FOR PEOPLE</text><circle cx="1053" cy="91" r="4" fill="#FFC58C" class="spark"/><path d="M838 168H1042" stroke="#FFC58C" stroke-opacity=".43" stroke-width="2" stroke-dasharray="10 8" class="flow"/></g>
</svg>