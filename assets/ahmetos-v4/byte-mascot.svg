<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
<title id="title">Byte, the AhmetOS pixel-art robot</title><desc id="desc">A friendly teal and lilac pixel robot waving in an arcade-themed environment with small drifting stars and animated eye lights.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E1935"/><stop offset="1" stop-color="#241333"/></linearGradient><radialGradient id="halo"><stop stop-color="#7EE8F3" stop-opacity=".25"/><stop offset="1" stop-color="#7EE8F3" stop-opacity="0"/></radialGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#93B7E6" stroke-opacity=".08" fill="none"/></pattern></defs>
<style>.robot{animation:bob 3.4s ease-in-out infinite;transform-origin:180px 188px}.eye{animation:blink 5.3s steps(1,end) infinite}.spark{animation:twinkle 2.7s ease-in-out infinite}.spark2{animation:twinkle 4s ease-in-out 1.3s infinite}.wave{animation:wave 2s ease-in-out infinite;transform-origin:285px 179px}
@keyframes bob{0%,100%{transform:translateY(1px)}50%{transform:translateY(-7px)}}@keyframes blink{0%,94%,100%{opacity:1}95%,97%{opacity:.1}}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(15deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
