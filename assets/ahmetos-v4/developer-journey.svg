<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">AhmetOS Developer Journey</title><desc id="d">Five selected career chapters shown as a neon quest map: Computer Engineering graduation, AI Academy DermaScope team, TUBITAK STING STAR research, Erasmus ZeroWaste, and future backend and applied AI work. The map is thematic, not an exact chronology.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11182D"/><stop offset="1" stop-color="#2B1838"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62EAD8"/><stop offset=".3" stop-color="#BBA3FF"/><stop offset=".6" stop-color="#7CBBFF"/><stop offset="1" stop-color="#FF92C0"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.travel{animation:travel 7s linear infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="1098" height="388" rx="19" fill="url(#bg)" stroke="#505779" stroke-width="2"/><path d="M3 3H1097" stroke="url(#line)" stroke-width="4"/><text x="28" y="42" font-family="monospace" font-size="18" fill="#70ECDD">DEVELOPER JOURNEY  // QUEST MAP</text><text x="28" y="69" font-size="15" fill="#C3D1E7">Selected real chapters, illustrated as a game map</text><path d="M121 294H985" stroke="#45577D" stroke-width="8" stroke-linecap="round"/><path d="M121 294H985" stroke="url(#line)" stroke-width="4" stroke-dasharray="15 13" class="travel"/><g><rect x="24" y="95" width="194" height="168" rx="16" fill="#1B2941" stroke="#65E9D6" stroke-width="2"/><text x="39" y="128" fill="#65E9D6" font-family="monospace" font-size="14">01 / CHECKPOINT</text><text x="39" y="171" fill="#F7F7FF" font-size="19" font-weight="bold">SDU</text><text x="39" y="201" fill="#D6DFF3" font-size="14">Computer Engineering</text><text x="39" y="236" fill="#65E9D6" font-size="13">Graduate in 2026</text><path d="M121 263V294" stroke="#65E9D6" stroke-width="3"/><circle cx="121" cy="294" r="13" fill="#14243A" stroke="#65E9D6" stroke-width="3" class="pulse"/></g><g><rect x="240" y="95" width="194" height="168" rx="16" fill="#1B2941" stroke="#BEA5FF" stroke-width="2"/><text x="255" y="128" fill="#BEA5FF" font-family="monospace" font-size="14">02 / CHECKPOINT</text><text x="255" y="171" fill="#F7F7FF" font-size="19" font-weight="bold">AI ACADEMY</text><text x="255" y="201" fill="#D6DFF3" font-size="14">DermaScope</text><text x="255" y="236" fill="#BEA5FF" font-size="13">Team bootcamp</text><path d="M337 263V294" stroke="#BEA5FF" stroke-width="3"/><circle cx="337" cy="294" r="13" fill="#14243A" stroke="#BEA5FF" stroke-width="3" class="pulse"/></g><g><rect x="456" y="95" width="194" height="168" rx="16" fill="#1B2941" stroke="#7CBEFF" stroke-width="2"/><text x="471" y="128" fill="#7CBEFF" font-family="monospace" font-size="14">03 / CHECKPOINT</text><text x="471" y="171" fill="#F7F7FF" font-size="19" font-weight="bold">TUBITAK STAR</text><text x="471" y="201" fill="#D6DFF3" font-size="14">STING</text><text x="471" y="236" fill="#7CBEFF" font-size="13">Research contributor</text><path d="M553 263V294" stroke="#7CBEFF" stroke-width="3"/><circle cx="553" cy="294" r="13" fill="#14243A" stroke="#7CBEFF" stroke-width="3" class="pulse"/></g><g><rect x="672" y="95" width="194" height="168" rx="16" fill="#1B2941" stroke="#FFC98E" stroke-width="2"/><text x="687" y="128" fill="#FFC98E" font-family="monospace" font-size="14">04 / CHECKPOINT</text><text x="687" y="171" fill="#F7F7FF" font-size="19" font-weight="bold">ERASMUS+</text><text x="687" y="201" fill="#D6DFF3" font-size="14">ZeroWaste Kitchen</text><text x="687" y="236" fill="#FFC98E" font-size="13">Mobile development</text><path d="M769 263V294" stroke="#FFC98E" stroke-width="3"/><circle cx="769" cy="294" r="13